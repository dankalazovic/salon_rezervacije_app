services:
  # ── Baze podataka ──────────────────────────────────────────────────────────

  salon-db:
    image: postgres:16
    container_name: salon-db
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon_db
    ports:
      - "5432:5432"
    volumes:
      - salon_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  portal-db:
    image: postgres:16
    container_name: portal-db
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_db
    ports:
      - "5433:5432"
    volumes:
      - portal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (cache + pub/sub) ────────────────────────────────────────────────

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Salon backend ──────────────────────────────────────────────────────────

  salon-backend:
    build:
      context: ./apps/salon-backend
      dockerfile: Dockerfile
    container_name: salon-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_HOST: salon-db
      DB_PORT: 5432
      DB_USER: salon
      DB_PASSWORD: salon
      DB_NAME: salon_db
      REDIS_URL: redis://redis:6379
    depends_on:
      salon-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker ──────────────

  salon-worker:
    build:
      context: ./apps/salon-backend
      dockerfile: Dockerfile.worker
    container_name: salon-worker
    environment:
      DB_HOST: salon-db
      DB_PORT: 5432
      DB_USER: salon
      DB_PASSWORD: salon
      DB_NAME: salon_db
      REDIS_URL: redis://redis:6379
    depends_on:
      salon-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Portal backend ─────────────────────────────────────────────────────────

  portal-backend:
    build:
      context: ./apps/portal-backend
      dockerfile: Dockerfile
    container_name: portal-backend
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DB_HOST: portal-db
      DB_PORT: 5432
      DB_USER: portal
      DB_PASSWORD: portal
      DB_NAME: portal_db
      REDIS_URL: redis://redis:6379
      SALON_API_URL: http://salon-backend:4000
    depends_on:
      portal-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      salon-backend:
        condition: service_started

  # ── Portal subscriber ──────────────────────────────────────────────────────

  portal-subscriber:
    build:
      context: ./apps/portal-backend
      dockerfile: Dockerfile.subscriber
    container_name: portal-subscriber
    environment:
      DB_HOST: portal-db
      DB_PORT: 5432
      DB_USER: portal
      DB_PASSWORD: portal
      DB_NAME: portal_db
      REDIS_URL: redis://redis:6379
      SALON_API_URL: http://salon-backend:4000
    depends_on:
      portal-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  salon_db_data:
  portal_db_data: